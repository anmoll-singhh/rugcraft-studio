    <script>
      try {
        var s = document.documentElement.style;
        var themes = {
          cloth: ["#F4EFE6","#E8E0D2","#1C1612","#5C534A","#8E2420","#F7F3EC","#D5CBBA"],
          espresso: ["#16120E","#221C17","#F4EFE6","#B5A898","#E24B42","#16120E","#3A322B"],
          navy: ["#101820","#182430","#F3F1EA","#9AABBA","#E24B42","#F7F3EC","#2A3A4A"],
          obsidian: ["#0E0D0C","#1A1816","#F4EFE6","#A69E93","#C85A32","#F7F3EC","#2C2824"],
          forest: ["#101612","#1A2420","#F3F0E8","#9AADA2","#D4A24A","#16120E","#2A3830"]
        }[localStorage.getItem("rugcraft-theme-v4")];
        if (themes) {
          ["--background","--card","--foreground","--muted-foreground","--primary","--primary-foreground","--border"].forEach(function (k, i) { s.setProperty(k, themes[i]); });
          s.setProperty("--secondary", themes[1]);
          s.setProperty("--muted", themes[1]);
          s.setProperty("--card-foreground", themes[2]);
          s.setProperty("--ring", themes[4]);
        }
        var fonts = {
          shoulders: ['"Big Shoulders Display", Impact, sans-serif', '"Source Sans 3", sans-serif'],
          fraunces: ['"Fraunces", Georgia, serif', '"Source Sans 3", sans-serif'],
          instrument: ['"Instrument Serif", Georgia, serif', '"DM Sans", sans-serif'],
          syne: ['"Syne", sans-serif', '"DM Sans", sans-serif']
        }[localStorage.getItem("rugcraft-font-v4")];
        if (fonts) {
          s.setProperty("--font-display", fonts[0]);
          s.setProperty("--font-sans", fonts[1]);
          s.setProperty("--font-mono", fonts[1]);
        }
      } catch (e) {}
    </script>
